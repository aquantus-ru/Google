<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explore Pages</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
        .actions { white-space: nowrap; }
        .btn { padding: 5px 10px; text-decoration: none; background: #007bff; color: white; border-radius: 3px; border: none; cursor: pointer; }
        .btn-danger { background: #dc3545; }
        .mb { margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Explore Indexed Pages</h1>
    <a href="/" class="mb">Back to Home</a> |
    <a href="/explore/add" class="btn mb">Add New Entry</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>URL</th>
                <th>Title</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for page in pages %}
            <tr>
                <td>{{ page[0] }}</td>
                <td><a href="{{ page[1] }}" target="_blank">{{ page[1] }}</a></td>
                <td>{{ page[2] }}</td>
                <td class="actions">
                    <a href="/explore/edit/{{ page[0] }}" class="btn">Edit</a>
                    <form action="/explore/delete/{{ page[0] }}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No pages indexed yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
