<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} Page</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 150px; }
        .btn { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 3px; }
        .cancel { background: #6c757d; text-decoration: none; padding: 10px 15px; border-radius: 3px; color: white; }
    </style>
</head>
<body>
    <h1>{{ action }} Page</h1>

    <form method="post">
        <div class="form-group">
            <label for="url">URL:</label>
            <input type="text" id="url" name="url" value="{{ page.url if page else '' }}" required>
        </div>

        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="{{ page.title if page else '' }}" required>
        </div>

        <div class="form-group">
            <label for="content">Content:</label>
            <textarea id="content" name="content" required>{{ page.content if page else '' }}</textarea>
        </div>

        <button type="submit" class="btn">Save</button>
        <a href="/explore" class="cancel">Cancel</a>
    </form>
</body>
</html>
